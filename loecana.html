<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lorcana Booster Battle</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #eef6ff;
      margin: 0;
      padding: 20px;
      text-align: center;
    }

    h1 {
      font-size: 28px;
      margin-bottom: 20px;
    }

    .players {
      display: flex;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    .playerBox {
      width: 48%;
      background: white;
      border-radius: 12px;
      padding: 15px;
      box-shadow: 0 0 8px rgba(0,0,0,0.15);
    }

    .score {
      font-size: 40px;
      font-weight: bold;
      margin: 10px 0;
    }

    .rarityRow {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 8px 0;
      padding: 8px;
      background: #f7fbff;
      border-radius: 10px;
    }

    button {
      font-size: 18px;
      padding: 6px 12px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    .plus { background: #4caf50; color: white; }
    .minus { background: #f44336; color: white; }

    .count {
      font-size: 18px;
      width: 30px;
      display: inline-block;
    }

    .reset {
      margin-top: 25px;
      font-size: 20px;
      padding: 12px 25px;
      background: black;
      color: white;
      border-radius: 12px;
    }
  </style>
</head>

<body>

<h1>Lorcana Booster Battle</h1>

<div class="players">

  <div class="playerBox">
    <h2>Spieler 1</h2>
    <div class="score" id="score1">0</div>

    <div id="rows1"></div>
  </div>

  <div class="playerBox">
    <h2>Spieler 2</h2>
    <div class="score" id="score2">0</div>

    <div id="rows2"></div>
  </div>

</div>

<button class="reset" onclick="resetAll()">RESET</button>

<script>
  const rarities = [
    { name: "Foil Common", points: 1 },
    { name: "Normal Common", points: 2 },
    { name: "Foil Rare", points: 3 },
    { name: "Normal Rare", points: 4 },
    { name: "Legendary", points: 5 },
    { name: "Foil Super Rare", points: 8 },
    { name: "Enchanted", points: 12 },
    { name: "Chase Swirl", points: 25 }
  ];

  let counts1 = Array(rarities.length).fill(0);
  let counts2 = Array(rarities.length).fill(0);

  function buildRows(player) {
    const container = document.getElementById("rows" + player);

    rarities.forEach((r, i) => {
      const row = document.createElement("div");
      row.className = "rarityRow";

      row.innerHTML = `
        <span> (x)</span>
        <button class="minus" onclick="change(, , -1)">-</button>
        <span class="count" id="c_">0</span>
        <button class="plus" onclick="change(, , 1)">+</button>
      `;

      container.appendChild(row);
    });
  }

  function change(player, index, delta) {
    let counts = player === 1 ? counts1 : counts2;

    counts[index] += delta;
    if (counts[index] < 0) counts[index] = 0;

    document.getElementById(`c_`).innerText = counts[index];

    updateScore(player);
  }

  function updateScore(player) {
    let counts = player === 1 ? counts1 : counts2;
    let score = 0;

    counts.forEach((c, i) => {
      score += c * rarities[i].points;
    });

    document.getElementById("score" + player).innerText = score;
  }

  function resetAll() {
    counts1.fill(0);
    counts2.fill(0);

    rarities.forEach((r, i) => {
      document.getElementById(`c1_`).innerText = 0;
      document.getElementById(`c2_`).innerText = 0;
    });

    updateScore(1);
    updateScore(2);
  }

  buildRows(1);
  buildRows(2);
</script>

</body>
</html>
