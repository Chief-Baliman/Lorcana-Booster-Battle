<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lorcana Battle">
<meta name="format-detection" content="telephone=no">
<title>Lorcana Booster Battle</title>

<style>
:root{
  --bg1:#070A12;
  --bg2:#0B1430;
  --stroke:rgba(255,255,255,.08);
  --text:#EAF0FF;
  --muted:rgba(234,240,255,.70);
  --shadow:0 16px 44px rgba(0,0,0,.55);
  --radius:18px;
  --radius2:14px;
  --green:#36D27B;
  --red:#FF4D5E;
  --blue:#6CA8FF;
  --chip:rgba(255,255,255,.07);
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  color:var(--text);

  background-color:#070A12;
  background-image:
    radial-gradient(1200px 900px at 20% -10%, rgba(108,168,255,.35), transparent 55%),
    radial-gradient(900px 700px at 100% 0%, rgba(54,210,123,.22), transparent 55%),
    radial-gradient(900px 700px at 30% 110%, rgba(255,77,94,.12), transparent 55%);
  background-repeat:no-repeat;
  background-attachment:fixed;

  padding:0 14px env(safe-area-inset-bottom) 14px;
}
  

/* Entfernt die “bläuliche Kante” unten:
   Kein Sticky-Footer, kein Verlauf am Seitenende, und genug Abstand zum Safe-Area */
.page{
  padding:10px 0 calc(22px + env(safe-area-inset-bottom)) 0;
}

.safeTop{height: env(safe-area-inset-top);}

.header{
  position:sticky;
  top:0;
  z-index:10;
  padding:12px 0 10px 0;
  background:
    linear-gradient(180deg, rgba(7,10,18,.98), rgba(7,10,18,.78) 55%, rgba(7,10,18,0));
  backdrop-filter: blur(14px);
}

.headerInner{
  border:1px solid rgba(255,255,255,.08);
  background:rgba(12,18,40,.60);
  border-radius:20px;
  padding:12px 12px;
  box-shadow:0 14px 34px rgba(0,0,0,.40);
}

.topRow{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

h1{
  margin:0;
  font-size:16px;
  letter-spacing:.2px;
  font-weight:950;
  line-height:1.1;
}

.sub{
  display:flex;
  align-items:center;
  gap:8px;
  font-size:11px;
  color:var(--muted);
  white-space:nowrap;
}

.dot{
  width:7px;height:7px;border-radius:99px;background:var(--green);
  box-shadow:0 0 0 4px rgba(54,210,123,.12);
}

.midRow{
  margin-top:10px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.switch{
  display:flex;
  background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.08);
  border-radius:999px;
  padding:4px;
  gap:4px;
  flex:1;
  max-width: 260px;
}

.seg{
  flex:1;
  border:0;
  padding:9px 10px;
  border-radius:999px;
  background:transparent;
  color:rgba(234,240,255,.75);
  font-weight:950;
  font-size:12px;
  cursor:pointer;
  touch-action:manipulation;
  -webkit-tap-highlight-color: transparent;
}

.seg.active{
  background:linear-gradient(180deg, rgba(108,168,255,.28), rgba(255,255,255,.06));
  border:1px solid rgba(108,168,255,.22);
  color:var(--text);
}

.scoreChips{
  display:flex;
  gap:8px;
  align-items:center;
}

.chip{
  background:var(--chip);
  border:1px solid rgba(255,255,255,.08);
  border-radius:999px;
  padding:9px 10px;
  font-size:12px;
  color:var(--muted);
  display:flex;
  align-items:center;
  gap:8px;
}

.chip b{
  color:var(--text);
  font-weight:950;
  min-width: 18px;
  text-align:right;
}

.card{
  background:linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,.03));
  border:1px solid var(--stroke);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  overflow:hidden;
}

.cardHeader{
  padding:14px 14px 10px 14px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  border-bottom:1px solid rgba(255,255,255,.06);
  background:linear-gradient(180deg, rgba(255,255,255,.04), transparent);
}

.playerName{
  font-size:14px;
  font-weight:950;
  display:flex;
  align-items:center;
  gap:10px;
}

.icon{
  width:22px;height:22px;border-radius:9px;
  background:
    radial-gradient(12px 12px at 30% 30%, rgba(255,255,255,.55), rgba(255,255,255,.12)),
    linear-gradient(180deg, rgba(108,168,255,.25), rgba(255,255,255,.02));
  border:1px solid rgba(255,255,255,.10);
}

.badge{
  font-size:11px;
  padding:6px 8px;
  border-radius:999px;
  background:rgba(108,168,255,.14);
  border:1px solid rgba(108,168,255,.22);
  color:rgba(234,240,255,.88);
}

.score{
  font-size:34px;
  font-weight:980;
}

.rows{
  padding:10px 12px 12px 12px;
  display:flex;
  flex-direction:column;
  gap:10px;
}

.section{
  margin-top:2px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  padding:10px 12px;
  border-radius:14px;
  background:rgba(255,255,255,.04);
  border:1px solid rgba(255,255,255,.06);
  color:rgba(234,240,255,.86);
  font-weight:900;
  font-size:12px;
  letter-spacing:.2px;
}

.row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  padding:12px;
  border-radius:var(--radius2);
  background:linear-gradient(180deg, rgba(255,255,255,.04), rgba(255,255,255,.02));
  border:1px solid rgba(255,255,255,.06);
}

.left{
  display:flex;
  flex-direction:column;
  align-items:flex-start;
  gap:4px;
  min-width: 190px;
}

.rTitle{
  font-size:13px;
  font-weight:950;
  color:rgba(234,240,255,.92);
}

.meta{
  display:flex;
  align-items:center;
  gap:8px;
  font-size:12px;
  color:var(--muted);
}

.tag{
  padding:4px 8px;
  border-radius:999px;
  background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.08);
}

.controls{
  display:flex;
  align-items:center;
  gap:10px;
}

.count{
  width:34px;
  text-align:center;
  font-size:16px;
  font-weight:980;
}

.btn{
  width:46px;
  height:42px;
  border:0;
  border-radius:14px;
  font-size:18px;
  font-weight:980;
  color:#0b0f1f;
  cursor:pointer;
  touch-action:manipulation;
  -webkit-tap-highlight-color: transparent;
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow: 0 10px 18px rgba(0,0,0,.35);
}

.btn:active{transform: translateY(1px) scale(.99)}
.plus{background:linear-gradient(180deg, rgba(54,210,123,1), rgba(54,210,123,.78))}
.minus{background:linear-gradient(180deg, rgba(255,77,94,1), rgba(255,77,94,.78))}

.actions{
  margin-top:12px;
}

.resetBtn{
  width:100%;
  padding:14px 16px;
  border-radius:18px;
  border:1px solid rgba(255,255,255,.10);
  background:linear-gradient(180deg, rgba(255,77,94,.18), rgba(255,255,255,.05));
  color:var(--text);
  font-weight:980;
  font-size:14px;
  letter-spacing:.2px;
  box-shadow:0 14px 34px rgba(0,0,0,.40);
  cursor:pointer;
  touch-action:manipulation;
  -webkit-tap-highlight-color: transparent;
}

.resetBtn:active{transform: translateY(1px)}

.tip{
  margin:10px 2px 0 2px;
  font-size:11px;
  color:var(--muted);
  line-height:1.35;
}

  .brand{
  display:flex;
  align-items:center;
  gap:14px;
}

.logo{
  width:44px;
  height:44px;
  object-fit:contain;
  border-radius:14px;
  box-shadow:
    0 0 0 1px rgba(255,255,255,.08),
    0 10px 28px rgba(0,0,0,.55),
    0 0 25px rgba(108,168,255,.18);
}

.brandText .title{
  font-size:16px;
  font-weight:950;
  letter-spacing:.2px;
}

.brandText .sub{
  display:flex;
  align-items:center;
  gap:8px;
  font-size:11px;
  color:var(--muted);
}

.hidden{display:none}
</style>
</head>

<body>
<div class="safeTop"></div>

<div class="header">
  <div class="headerInner">
    <div class="topRow">
     <div class="brand">
  <img src="logo.png" alt="Chief Baliman Logo" class="logo">
  <div class="brandText">
    <div class="title">Lorcana Booster Battle</div>
    <div class="sub">
      <span class="dot"></span>
      <span id="statusText">JavaScript aktiv</span>
    </div>
  </div>
</div>

      <div class="scoreChips" aria-label="Scores">
        <div class="chip">S1 <b id="chip1">0</b></div>
        <div class="chip">S2 <b id="chip2">0</b></div>
      </div>
    </div>

    <div class="midRow">
      <div class="switch" role="tablist" aria-label="Spieler wechseln">
        <button class="seg active" id="tab1" type="button">Spieler 1</button>
        <button class="seg" id="tab2" type="button">Spieler 2</button>
      </div>

      <div class="sub" id="leadText">–</div>
    </div>
  </div>
</div>

<div class="page">
  <div class="card" id="card1" data-player="1">
    <div class="cardHeader">
      <div class="playerName">
        <span class="icon"></span>
        <span>Spieler 1</span>
        <span class="badge" id="lead1">–</span>
      </div>
      <div class="score" id="score1">0</div>
    </div>
    <div class="rows" id="rows1"></div>
  </div>

  <div class="card hidden" id="card2" data-player="2">
    <div class="cardHeader">
      <div class="playerName">
        <span class="icon"></span>
        <span>Spieler 2</span>
        <span class="badge" id="lead2">–</span>
      </div>
      <div class="score" id="score2">0</div>
    </div>
    <div class="rows" id="rows2"></div>
  </div>

  <div class="actions">
    <button class="resetBtn" id="resetBtn" type="button">Reset</button>
  </div>

  <div class="tip">Tipp: Zum Home-Bildschirm hinzufügen, dann fühlt es sich wie eine App an.</div>
</div>

<script>
/*
Punktesystem (dein neues):
Common & Uncommon: 0
Rare Normal: 0
Rare Foil: 1
Super Rare Normal: 2
Super Rare Foil: 3
Legendary Normal: 4
Legendary Foil: 8
Epic: 5
Enchanted: 12
Iconic: 25
*/

const sections = [
  { title: "0 Punkte", ids: ["common_uncommon", "rare_normal"] },
  { title: "Rares", ids: ["rare_foil", "super_rare_normal", "super_rare_foil"] },
  { title: "High Tier", ids: ["legendary_normal", "legendary_foil", "epic", "enchanted", "iconic"] }
];

const rarities = [
  { id:"common_uncommon", name:"Common & Uncommon", points:0, group:"0 Pkt" },
  { id:"rare_normal",     name:"Rare (Normal)",     points:0, group:"0 Pkt" },

  { id:"rare_foil",        name:"Rare (Foil)",        points:1, group:"Rare" },
  { id:"super_rare_normal",name:"Super Rare (Normal)",points:2, group:"Rare" },
  { id:"super_rare_foil",  name:"Super Rare (Foil)",  points:3, group:"Rare" },

  { id:"legendary_normal", name:"Legendary (Normal)", points:4, group:"High" },
  { id:"epic",             name:"Epic",               points:5, group:"High" },
  { id:"legendary_foil",   name:"Legendary (Foil)",   points:8, group:"High" },
  { id:"enchanted",        name:"Enchanted",          points:12,group:"High" },
  { id:"iconic",           name:"Iconic",             points:25,group:"High" }
];

const byId = Object.fromEntries(rarities.map(r => [r.id, r]));

const state = {
  1: Object.fromEntries(rarities.map(r => [r.id, 0])),
  2: Object.fromEntries(rarities.map(r => [r.id, 0]))
};

function addTap(el, fn){
  el.addEventListener("click", fn);
  el.addEventListener("touchend", (e) => { e.preventDefault(); fn(); }, { passive:false });
}

function buildRows(player){
  const wrap = document.getElementById("rows"+player);
  wrap.innerHTML = "";

  sections.forEach(sec => {
    const s = document.createElement("div");
    s.className = "section";
    s.textContent = sec.title;
    wrap.appendChild(s);

    sec.ids.forEach(id => {
      const r = byId[id];
      const row = document.createElement("div");
      row.className = "row";
      row.setAttribute("data-id", r.id);

      const tagText = r.points === 1 ? "1 Punkt" : (r.points + " Punkte");

      row.innerHTML = `
        <div class="left">
          <div class="rTitle">${r.name}</div>
          <div class="meta">
            <span class="tag">${tagText}</span>
            <span>${r.group}</span>
          </div>
        </div>
        <div class="controls">
          <button class="btn minus" type="button" aria-label="minus">−</button>
          <div class="count">0</div>
          <button class="btn plus" type="button" aria-label="plus">+</button>
        </div>
      `;
      wrap.appendChild(row);

      const countEl = row.querySelector(".count");
      const plus = row.querySelector(".plus");
      const minus = row.querySelector(".minus");

      addTap(plus, () => {
        state[player][r.id] += 1;
        countEl.textContent = String(state[player][r.id]);
        render();
      });

      addTap(minus, () => {
        state[player][r.id] = Math.max(0, state[player][r.id] - 1);
        countEl.textContent = String(state[player][r.id]);
        render();
      });
    });
  });
}

function scoreOf(player){
  let s = 0;
  rarities.forEach(r => { s += state[player][r.id] * r.points; });
  return s;
}

function setLeads(s1, s2){
  const b1 = document.getElementById("lead1");
  const b2 = document.getElementById("lead2");
  const leadText = document.getElementById("leadText");

  if (s1 === 0 && s2 === 0){
    b1.textContent = "–";
    b2.textContent = "–";
    leadText.textContent = "–";
    return;
  }
  if (s1 > s2){
    b1.textContent = "führt";
    b2.textContent = "hinten";
    leadText.textContent = "Spieler 1 führt";
  } else if (s2 > s1){
    b2.textContent = "führt";
    b1.textContent = "hinten";
    leadText.textContent = "Spieler 2 führt";
  } else {
    b1.textContent = "gleich";
    b2.textContent = "gleich";
    leadText.textContent = "Gleichstand";
  }
}

function render(){
  const s1 = scoreOf(1);
  const s2 = scoreOf(2);

  document.getElementById("score1").textContent = String(s1);
  document.getElementById("score2").textContent = String(s2);
  document.getElementById("chip1").textContent = String(s1);
  document.getElementById("chip2").textContent = String(s2);

  setLeads(s1, s2);
}

function resetAll(){
  [1,2].forEach(p => {
    rarities.forEach(r => { state[p][r.id] = 0; });

    const rows = document.getElementById("rows"+p).querySelectorAll(".row");
    rows.forEach(row => row.querySelector(".count").textContent = "0");
  });
  render();
}

function showPlayer(p){
  const c1 = document.getElementById("card1");
  const c2 = document.getElementById("card2");
  const t1 = document.getElementById("tab1");
  const t2 = document.getElementById("tab2");

  if (p === 1){
    c1.classList.remove("hidden");
    c2.classList.add("hidden");
    t1.classList.add("active");
    t2.classList.remove("active");
  } else {
    c2.classList.remove("hidden");
    c1.classList.add("hidden");
    t2.classList.add("active");
    t1.classList.remove("active");
  }
}

buildRows(1);
buildRows(2);
render();
showPlayer(1);

addTap(document.getElementById("resetBtn"), resetAll);
addTap(document.getElementById("tab1"), () => showPlayer(1));
addTap(document.getElementById("tab2"), () => showPlayer(2));
document.getElementById("statusText").textContent = "JavaScript aktiv";
</script>

</body>
</html>
