<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lorcana Battle">
<meta name="format-detection" content="telephone=no">
<title>Lorcana Booster Battle</title>

<style>
:root{
  --bg1:#070A12;
  --bg2:#0B1430;
  --stroke:rgba(255,255,255,.08);
  --text:#EAF0FF;
  --muted:rgba(234,240,255,.70);
  --shadow:0 16px 44px rgba(0,0,0,.55);
  --radius:18px;
  --radius2:14px;
  --green:#36D27B;
  --red:#FF4D5E;
  --blue:#6CA8FF;
  --chip:rgba(255,255,255,.07);
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  color:var(--text);
  background:
    radial-gradient(1200px 900px at 20% -10%, rgba(108,168,255,.35), transparent 55%),
    radial-gradient(900px 700px at 100% 0%, rgba(54,210,123,.22), transparent 55%),
    radial-gradient(900px 700px at 30% 110%, rgba(255,77,94,.20), transparent 55%),
    linear-gradient(160deg,var(--bg1),var(--bg2));
  padding:14px 14px calc(18px + env(safe-area-inset-bottom));
}

.header{
  display:flex;
  flex-direction:column;
  gap:10px;
  padding:6px 2px 8px 2px;
}

.titleRow{
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:10px;
}

h1{
  margin:0;
  font-size:22px;
  letter-spacing:.3px;
  font-weight:900;
}

.sub{
  display:flex;
  align-items:center;
  gap:8px;
  font-size:12px;
  color:var(--muted);
  white-space:nowrap;
}

.dot{
  width:8px;height:8px;border-radius:99px;background:var(--green);
  box-shadow:0 0 0 4px rgba(54,210,123,.12);
}

.topBar{
  display:flex;
  gap:10px;
  align-items:center;
  justify-content:space-between;
}

.scoreChips{
  display:flex;
  gap:8px;
  align-items:center;
}

.chip{
  background:var(--chip);
  border:1px solid var(--stroke);
  border-radius:999px;
  padding:8px 10px;
  font-size:12px;
  color:var(--muted);
  display:flex;
  align-items:center;
  gap:8px;
  backdrop-filter: blur(10px);
}

.chip b{color:var(--text); font-weight:900}

.switch{
  display:flex;
  background:rgba(255,255,255,.06);
  border:1px solid var(--stroke);
  border-radius:999px;
  padding:4px;
  gap:4px;
  box-shadow:0 10px 24px rgba(0,0,0,.35);
}

.seg{
  border:0;
  padding:8px 12px;
  border-radius:999px;
  background:transparent;
  color:rgba(234,240,255,.75);
  font-weight:900;
  font-size:12px;
  cursor:pointer;
  touch-action:manipulation;
  -webkit-tap-highlight-color: transparent;
}

.seg.active{
  background:linear-gradient(180deg, rgba(108,168,255,.28), rgba(255,255,255,.06));
  border:1px solid rgba(108,168,255,.22);
  color:var(--text);
}

.card{
  margin-top:10px;
  background:linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,.03));
  border:1px solid var(--stroke);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  overflow:hidden;
}

.cardHeader{
  padding:14px 14px 10px 14px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  border-bottom:1px solid rgba(255,255,255,.06);
  background:linear-gradient(180deg, rgba(255,255,255,.04), transparent);
}

.playerName{
  font-size:14px;
  font-weight:900;
  letter-spacing:.2px;
  display:flex;
  align-items:center;
  gap:10px;
}

.icon{
  width:22px;height:22px;border-radius:9px;
  background:
    radial-gradient(12px 12px at 30% 30%, rgba(255,255,255,.55), rgba(255,255,255,.12)),
    linear-gradient(180deg, rgba(108,168,255,.25), rgba(255,255,255,.02));
  border:1px solid rgba(255,255,255,.10);
  box-shadow: inset 0 -10px 20px rgba(0,0,0,.18);
}

.badge{
  font-size:11px;
  padding:6px 8px;
  border-radius:999px;
  background:rgba(108,168,255,.14);
  border:1px solid rgba(108,168,255,.22);
  color:rgba(234,240,255,.88);
}

.score{
  font-size:34px;
  font-weight:950;
  letter-spacing:.3px;
}

.rows{padding:10px 12px 12px 12px; display:flex; flex-direction:column; gap:10px}

.row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  padding:12px;
  border-radius:var(--radius2);
  background:linear-gradient(180deg, rgba(255,255,255,.04), rgba(255,255,255,.02));
  border:1px solid rgba(255,255,255,.06);
}

.left{
  display:flex;
  flex-direction:column;
  align-items:flex-start;
  gap:4px;
  min-width: 165px;
}

.rTitle{
  font-size:13px;
  font-weight:900;
  color:rgba(234,240,255,.92);
}

.meta{
  display:flex;
  align-items:center;
  gap:8px;
  font-size:12px;
  color:var(--muted);
}

.tag{
  padding:4px 8px;
  border-radius:999px;
  background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.08);
}

.controls{
  display:flex;
  align-items:center;
  gap:10px;
}

.count{
  width:34px;
  text-align:center;
  font-size:16px;
  font-weight:950;
  color:var(--text);
}

.btn{
  width:46px;
  height:42px;
  border:0;
  border-radius:14px;
  font-size:18px;
  font-weight:950;
  color:#0b0f1f;
  cursor:pointer;
  touch-action:manipulation;
  -webkit-tap-highlight-color: transparent;
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow: 0 10px 18px rgba(0,0,0,.35);
}

.btn:active{transform: translateY(1px) scale(.99)}
.plus{background:linear-gradient(180deg, rgba(54,210,123,1), rgba(54,210,123,.78))}
.minus{background:linear-gradient(180deg, rgba(255,77,94,1), rgba(255,77,94,.78))}

.footer{
  position:sticky;
  bottom:0;
  margin-top:12px;
  padding:10px 0 calc(6px + env(safe-area-inset-bottom));
}

.footerInner{
  display:flex;
  gap:10px;
}

.bigBtn{
  flex:1;
  padding:14px 16px;
  border-radius:18px;
  border:1px solid rgba(255,255,255,.10);
  background:linear-gradient(180deg, rgba(255,255,255,.10), rgba(255,255,255,.05));
  color:var(--text);
  font-weight:950;
  font-size:14px;
  letter-spacing:.3px;
  box-shadow:var(--shadow);
  cursor:pointer;
  touch-action:manipulation;
  -webkit-tap-highlight-color: transparent;
}

.bigBtn:active{transform: translateY(1px)}
.resetBtn{background:linear-gradient(180deg, rgba(255,77,94,.18), rgba(255,255,255,.05))}

.toast{
  position:fixed;
  left:50%;
  transform:translateX(-50%);
  bottom: calc(86px + env(safe-area-inset-bottom));
  background:rgba(12,18,40,.82);
  border:1px solid rgba(255,255,255,.12);
  padding:10px 12px;
  border-radius:14px;
  color:rgba(234,240,255,.9);
  font-size:12px;
  backdrop-filter: blur(14px);
  opacity:0;
  pointer-events:none;
  transition:opacity .18s ease;
}
.toast.show{opacity:1}

.small{
  font-size:11px;
  color:var(--muted);
  margin-top:6px;
}

.hidden{display:none}
</style>
</head>

<body>

<div class="header">
  <div class="titleRow">
    <h1>Lorcana Booster Battle</h1>
    <div class="sub">
      <span class="dot"></span>
      <span id="statusText">JavaScript aktiv</span>
    </div>
  </div>

  <div class="topBar">
    <div class="switch" role="tablist" aria-label="Spieler wechseln">
      <button class="seg active" id="tab1" type="button">Spieler 1</button>
      <button class="seg" id="tab2" type="button">Spieler 2</button>
    </div>

    <div class="scoreChips">
      <div class="chip">S1 <b id="chip1">0</b></div>
      <div class="chip">S2 <b id="chip2">0</b></div>
    </div>
  </div>
</div>

<div class="card" id="card1" data-player="1">
  <div class="cardHeader">
    <div class="playerName">
      <span class="icon"></span>
      <span>Spieler 1</span>
      <span class="badge" id="lead1">–</span>
    </div>
    <div class="score" id="score1">0</div>
  </div>
  <div class="rows" id="rows1"></div>
</div>

<div class="card hidden" id="card2" data-player="2">
  <div class="cardHeader">
    <div class="playerName">
      <span class="icon"></span>
      <span>Spieler 2</span>
      <span class="badge" id="lead2">–</span>
    </div>
    <div class="score" id="score2">0</div>
  </div>
  <div class="rows" id="rows2"></div>
</div>

<div class="footer">
  <div class="footerInner">
    <button class="bigBtn resetBtn" id="resetBtn" type="button">Reset</button>
    <button class="bigBtn" id="copyBtn" type="button">Score kopieren</button>
  </div>
  <div class="small">Tipp: Zum Home-Bildschirm hinzufügen, dann fühlt es sich wie eine App an.</div>
</div>

<div class="toast" id="toast">Kopiert</div>

<script>
const rarities = [
  { id:"foil_common",  name:"Foil Common",     mult:1,  group:"Foil" },
  { id:"normal_common",name:"Normal Common",   mult:2,  group:"Normal" },
  { id:"foil_rare",    name:"Foil Rare",       mult:3,  group:"Foil" },
  { id:"normal_rare",  name:"Normal Rare",     mult:4,  group:"Normal" },
  { id:"legendary",    name:"Legendary",       mult:5,  group:"Hit" },
  { id:"foil_super",   name:"Foil Super Rare", mult:8,  group:"Foil" },
  { id:"enchanted",    name:"Enchanted",       mult:12, group:"Hit" },
  { id:"chase",        name:"Chase Swirl",     mult:25, group:"Hit" }
];

const state = {
  1: Object.fromEntries(rarities.map(r => [r.id, 0])),
  2: Object.fromEntries(rarities.map(r => [r.id, 0]))
};

function addTap(el, fn){
  el.addEventListener("click", fn);
  el.addEventListener("touchend", (e) => { e.preventDefault(); fn(); }, { passive:false });
}

function buildRows(player){
  const wrap = document.getElementById("rows"+player);
  wrap.innerHTML = "";

  rarities.forEach(r => {
    const row = document.createElement("div");
    row.className = "row";
    row.setAttribute("data-id", r.id);
    row.innerHTML = `
      <div class="left">
        <div class="rTitle">${r.name}</div>
        <div class="meta">
          <span class="tag">x${r.mult}</span>
          <span>${r.group}</span>
        </div>
      </div>
      <div class="controls">
        <button class="btn minus" type="button" aria-label="minus">−</button>
        <div class="count">0</div>
        <button class="btn plus" type="button" aria-label="plus">+</button>
      </div>
    `;
    wrap.appendChild(row);

    const countEl = row.querySelector(".count");
    const plus = row.querySelector(".plus");
    const minus = row.querySelector(".minus");

    addTap(plus, () => {
      state[player][r.id] += 1;
      countEl.textContent = String(state[player][r.id]);
      render();
    });

    addTap(minus, () => {
      state[player][r.id] = Math.max(0, state[player][r.id] - 1);
      countEl.textContent = String(state[player][r.id]);
      render();
    });
  });
}

function scoreOf(player){
  let s = 0;
  rarities.forEach(r => { s += state[player][r.id] * r.mult; });
  return s;
}

function setLeadBadges(s1, s2){
  const b1 = document.getElementById("lead1");
  const b2 = document.getElementById("lead2");

  if (s1 === 0 && s2 === 0){
    b1.textContent = "–";
    b2.textContent = "–";
    return;
  }
  if (s1 > s2){
    b1.textContent = "führt";
    b2.textContent = "hinten";
  } else if (s2 > s1){
    b2.textContent = "führt";
    b1.textContent = "hinten";
  } else {
    b1.textContent = "gleich";
    b2.textContent = "gleich";
  }
}

function render(){
  const s1 = scoreOf(1);
  const s2 = scoreOf(2);

  document.getElementById("score1").textContent = String(s1);
  document.getElementById("score2").textContent = String(s2);
  document.getElementById("chip1").textContent = String(s1);
  document.getElementById("chip2").textContent = String(s2);

  setLeadBadges(s1, s2);
}

function resetAll(){
  [1,2].forEach(p => {
    rarities.forEach(r => { state[p][r.id] = 0; });
    const rows = document.getElementById("rows"+p).querySelectorAll(".row");
    rows.forEach(row => row.querySelector(".count").textContent = "0");
  });
  render();
}

function showToast(text){
  const t = document.getElementById("toast");
  t.textContent = text;
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 900);
}

function copyScore(){
  const s1 = scoreOf(1);
  const s2 = scoreOf(2);
  const lines = [];
  lines.push("Lorcana Booster Battle");
  lines.push("Spieler 1: " + s1);
  lines.push("Spieler 2: " + s2);
  lines.push("");
  lines.push("Details S1:");
  rarities.forEach(r => { if (state[1][r.id] > 0) lines.push("  " + r.name + " x" + state[1][r.id]); });
  lines.push("Details S2:");
  rarities.forEach(r => { if (state[2][r.id] > 0) lines.push("  " + r.name + " x" + state[2][r.id]); });
  const text = lines.join("\n");

  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(() => showToast("Score kopiert"));
  } else {
    const ta = document.createElement("textarea");
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand("copy");
    ta.remove();
    showToast("Score kopiert");
  }
}

function showPlayer(p){
  const c1 = document.getElementById("card1");
  const c2 = document.getElementById("card2");
  const t1 = document.getElementById("tab1");
  const t2 = document.getElementById("tab2");

  if (p === 1){
    c1.classList.remove("hidden");
    c2.classList.add("hidden");
    t1.classList.add("active");
    t2.classList.remove("active");
  } else {
    c2.classList.remove("hidden");
    c1.classList.add("hidden");
    t2.classList.add("active");
    t1.classList.remove("active");
  }
}

buildRows(1);
buildRows(2);
render();
showPlayer(1);

addTap(document.getElementById("resetBtn"), resetAll);
addTap(document.getElementById("copyBtn"), copyScore);
addTap(document.getElementById("tab1"), () => showPlayer(1));
addTap(document.getElementById("tab2"), () => showPlayer(2));
document.getElementById("statusText").textContent = "JavaScript aktiv";
</script>

</body>
</html>
