<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lorcana Battle">
<meta name="format-detection" content="telephone=no">
<title>Lorcana Booster Battle</title>

<style>
:root{
  --bg1:#07121F;
  --bg2:#0B2A3A;

  --stroke:rgba(255,255,255,.14);
  --text:#F6FBFF;
  --muted:rgba(246,251,255,.75);

  --shadow:0 18px 48px rgba(0,0,0,.42);

  --radius:20px;
  --radius2:16px;

  --green:#2FD37A;
  --red:#FF4D6D;

  --gold:#F7D37A;
  --gold2:#E7B84F;

  --chip:rgba(255,255,255,.12);
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  color:var(--text);

  background-color:#06111D;
  background-image:
    radial-gradient(900px 700px at 15% -10%, rgba(140,214,255,.55), transparent 55%),
    radial-gradient(900px 700px at 95% 10%, rgba(255,213,122,.28), transparent 55%),
    radial-gradient(900px 700px at 30% 110%, rgba(255,120,180,.18), transparent 60%),
    radial-gradient(700px 500px at 85% 95%, rgba(130,255,210,.12), transparent 60%);
  background-repeat:no-repeat;
  background-attachment:fixed;

  padding:0 14px env(safe-area-inset-bottom) 14px;
}
  

/* Entfernt die “bläuliche Kante” unten:
   Kein Sticky-Footer, kein Verlauf am Seitenende, und genug Abstand zum Safe-Area */
.page{
  padding:10px 0 calc(22px + env(safe-area-inset-bottom)) 0;
}

.safeTop{height: env(safe-area-inset-top);}

.header{
  position:sticky;
  top:0;
  z-index:10;
  padding:12px 0 10px 0;
  background:
    linear-gradient(180deg, rgba(7,10,18,.98), rgba(7,10,18,.78) 55%, rgba(7,10,18,0));
  backdrop-filter: blur(14px);
}

.headerInner{
  border:1px solid rgba(255,255,255,.08);
  background:rgba(12,18,40,.60);
  border-radius:20px;
  padding:12px 12px;
  box-shadow:0 14px 34px rgba(0,0,0,.40);
}

.topRow{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

h1{
  margin:0;
  font-size:16px;
  letter-spacing:.2px;
  font-weight:950;
  line-height:1.1;
}

.sub{
  display:flex;
  align-items:center;
  gap:8px;
  font-size:11px;
  color:var(--muted);
  white-space:nowrap;
}

.dot{
  width:7px;height:7px;border-radius:99px;background:var(--green);
  box-shadow:0 0 0 4px rgba(54,210,123,.12);
}

.midRow{
  margin-top:10px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.switch{
  display:flex;
  background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.08);
  border-radius:999px;
  padding:4px;
  gap:4px;
  flex:1;
  max-width: 260px;
}

.seg{
  flex:1;
  border:0;
  padding:9px 10px;
  border-radius:999px;
  background:transparent;
  color:rgba(234,240,255,.75);
  font-weight:950;
  font-size:12px;
  cursor:pointer;
  touch-action:manipulation;
  -webkit-tap-highlight-color: transparent;
}

.seg.active{
  background:linear-gradient(180deg, rgba(255,213,122,.28), rgba(255,255,255,.06));
  border:1px solid rgba(255,213,122,.25);
  color:var(--text);
}

.scoreChips{
  display:flex;
  gap:8px;
  align-items:center;
}

.chip{
  background:rgba(255,255,255,.10);
  border:1px solid rgba(255,255,255,.14);
  border-radius:999px;
  padding:9px 10px;
  font-size:12px;
  color:rgba(246,251,255,.78);
  display:flex;
  align-items:center;
  gap:8px;
}

.chip b{
  color:var(--gold);
  font-weight:950;
  min-width: 18px;
  text-align:right;
}

.card{
  background:
    radial-gradient(900px 220px at 20% 0%, rgba(255,213,122,.10), transparent 60%),
    linear-gradient(180deg, rgba(255,255,255,.10), rgba(255,255,255,.05));
  border:1px solid rgba(255,255,255,.14);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  overflow:hidden;
}
  
.cardHeader{
  padding:14px 14px 10px 14px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  border-bottom:1px solid rgba(255,255,255,.06);
  background:linear-gradient(180deg, rgba(255,255,255,.04), transparent);
}

.playerName{
  font-size:14px;
  font-weight:950;
  display:flex;
  align-items:center;
  gap:10px;
}

.icon{
  width:22px;height:22px;border-radius:9px;
  background:
    radial-gradient(12px 12px at 30% 30%, rgba(255,255,255,.55), rgba(255,255,255,.12)),
    linear-gradient(180deg, rgba(108,168,255,.25), rgba(255,255,255,.02));
  border:1px solid rgba(255,255,255,.10);
}

.badge{
  font-size:11px;
  padding:6px 8px;
  border-radius:999px;
  background:rgba(108,168,255,.14);
  border:1px solid rgba(108,168,255,.22);
  color:rgba(234,240,255,.88);
}

.score{
  font-size:34px;
  font-weight:980;
}

.rows{
  padding:10px 12px 12px 12px;
  display:flex;
  flex-direction:column;
  gap:10px;
}

.section{
  margin:16px 6px 6px 6px;
  padding:0;
  background:transparent;
  border:0;
  color:rgba(246,251,255,.80);
  font-weight:950;
  font-size:12px;
  letter-spacing:.35px;
  text-transform:uppercase;
  display:flex;
  align-items:center;
  gap:10px;
}

.section::after{
  content:"";
  height:1px;
  flex:1;
  background:linear-gradient(90deg, rgba(255,255,255,.16), rgba(255,255,255,0));
}

.row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  padding:13px;
  border-radius:18px;
  background:
    radial-gradient(700px 120px at 20% 0%, rgba(255,213,122,.08), transparent 60%),
    linear-gradient(180deg, rgba(255,255,255,.08), rgba(255,255,255,.03));
  border:1px solid rgba(255,255,255,.10);
}

.left{
  display:flex;
  flex-direction:column;
  align-items:flex-start;
  gap:4px;
  min-width: 190px;
}

.rTitle{
  font-size:13px;
  font-weight:950;
  color:rgba(234,240,255,.92);
}

.meta{
  display:flex;
  align-items:center;
  gap:8px;
  font-size:12px;
  color:var(--muted);
}

.tag{
  padding:4px 8px;
  border-radius:999px;
  background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.08);
}

.controls{
  display:flex;
  align-items:center;
  gap:10px;
}

.count{
  width:34px;
  text-align:center;
  font-size:16px;
  font-weight:980;
}

.btn{
  width:48px;
  height:44px;
  border:0;
  border-radius:18px;
  font-size:20px;
  font-weight:980;
  color:#08101b;
  cursor:pointer;
  touch-action:manipulation;
  -webkit-tap-highlight-color: transparent;
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow: 0 14px 26px rgba(0,0,0,.30);
  
.btn:active{transform: translateY(1px) scale(.99)}
.plus{
  background:
    radial-gradient(18px 18px at 30% 25%, rgba(255,255,255,.45), transparent 60%),
    linear-gradient(180deg, rgba(47,211,122,1), rgba(47,211,122,.78));
}
.minus{
  background:
    radial-gradient(18px 18px at 30% 25%, rgba(255,255,255,.40), transparent 60%),
    linear-gradient(180deg, rgba(255,77,109,1), rgba(255,77,109,.78));
}

.actions{
  margin-top:12px;
}

.resetBtn{
  width:100%;
  padding:15px 16px;
  border-radius:20px;
  border:1px solid rgba(255,255,255,.12);
  background:
    radial-gradient(900px 140px at 20% 0%, rgba(255,213,122,.14), transparent 55%),
    linear-gradient(180deg, rgba(255,255,255,.10), rgba(255,255,255,.04));
  color:var(--text);
  font-weight:980;
  font-size:14px;
  letter-spacing:.2px;
  box-shadow:0 16px 40px rgba(0,0,0,.35);
}
  
.resetBtn:active{transform: translateY(1px)}

.tip{
  margin:10px 2px 0 2px;
  font-size:11px;
  color:var(--muted);
  line-height:1.35;
}

  .brand{
  display:flex;
  align-items:center;
  gap:14px;
}

.logo{
  width:42px !important;
  height:42px !important;
  max-width:42px !important;
  max-height:42px !important;
  object-fit:contain;
  border-radius:12px;
  display:block;
}

.brandText .title{
  font-size:16px;
  font-weight:950;
  letter-spacing:.2px;
}

.brandText .sub{
  display:flex;
  align-items:center;
  gap:8px;
  font-size:11px;
  color:var(--muted);
}

.hidden{display:none}

  /* Sparkles (dezent, ohne Canvas) */
body::before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:0;

  background-image:
    radial-gradient(2px 2px at 12% 18%, rgba(255,255,255,.35), transparent 60%),
    radial-gradient(2px 2px at 28% 42%, rgba(255,255,255,.22), transparent 60%),
    radial-gradient(2px 2px at 43% 14%, rgba(255,213,122,.26), transparent 60%),
    radial-gradient(2px 2px at 62% 32%, rgba(140,214,255,.22), transparent 60%),
    radial-gradient(2px 2px at 78% 18%, rgba(255,255,255,.20), transparent 60%),
    radial-gradient(2px 2px at 86% 52%, rgba(255,213,122,.18), transparent 60%),
    radial-gradient(2px 2px at 18% 76%, rgba(255,255,255,.16), transparent 60%),
    radial-gradient(2px 2px at 55% 84%, rgba(140,214,255,.16), transparent 60%),
    radial-gradient(2px 2px at 90% 86%, rgba(255,255,255,.14), transparent 60%);

  opacity:.55;
  animation:sparkleFloat 10s ease-in-out infinite;
  transform: translate3d(0,0,0);
}

@keyframes sparkleFloat{
  0%   { transform: translate3d(0,0,0); opacity:.45; }
  50%  { transform: translate3d(0,-10px,0); opacity:.65; }
  100% { transform: translate3d(0,0,0); opacity:.45; }
}

/* sicherstellen, dass Content über Sparkles liegt */
.header, .page{ position:relative; z-index:1; }
  
</style>
</head>

<body>
<div class="safeTop"></div>

<div class="header">
  <div class="headerInner">
    <div class="topRow">
     <div class="brand">
  <img src="logo.png" alt="Chief Baliman Logo" class="logo">
  <div class="brandText">
    <div class="title">Lorcana Booster Battle</div>
    <div class="sub">
      <span class="dot"></span>
      <span id="statusText">JavaScript aktiv</span>
    </div>
  </div>
</div>

      <div class="scoreChips" aria-label="Scores">
        <div class="chip">S1 <b id="chip1">0</b></div>
        <div class="chip">S2 <b id="chip2">0</b></div>
      </div>
    </div>

    <div class="midRow">
      <div class="switch" role="tablist" aria-label="Spieler wechseln">
        <button class="seg active" id="tab1" type="button">Spieler 1</button>
        <button class="seg" id="tab2" type="button">Spieler 2</button>
      </div>

      <div class="sub" id="leadText">–</div>
    </div>
  </div>
</div>

<div class="page">
  <div class="card" id="card1" data-player="1">
    <div class="cardHeader">
      <div class="playerName">
        <span class="icon"></span>
        <span>Spieler 1</span>
        <span class="badge" id="lead1">–</span>
      </div>
      <div class="score" id="score1">0</div>
    </div>
    <div class="rows" id="rows1"></div>
  </div>

  <div class="card hidden" id="card2" data-player="2">
    <div class="cardHeader">
      <div class="playerName">
        <span class="icon"></span>
        <span>Spieler 2</span>
        <span class="badge" id="lead2">–</span>
      </div>
      <div class="score" id="score2">0</div>
    </div>
    <div class="rows" id="rows2"></div>
  </div>

  <div class="actions">
    <button class="resetBtn" id="resetBtn" type="button">Reset</button>
  </div>

  <div class="tip">Tipp: Zum Home-Bildschirm hinzufügen, dann fühlt es sich wie eine App an.</div>
</div>

<script>
/*
Punktesystem (dein neues):
Common & Uncommon: 0
Rare Normal: 0
Rare Foil: 1
Super Rare Normal: 2
Super Rare Foil: 3
Legendary Normal: 4
Legendary Foil: 8
Epic: 5
Enchanted: 12
Iconic: 25
*/

const sections = [
  { title: "0 Punkte", ids: ["common_uncommon", "rare_normal"] },
  { title: "Rares", ids: ["rare_foil", "super_rare_normal", "super_rare_foil"] },
  { title: "High Tier", ids: ["legendary_normal", "legendary_foil", "epic", "enchanted", "iconic"] }
];

const rarities = [
  { id:"common_uncommon", name:"Common & Uncommon", points:0, group:"0 Pkt" },
  { id:"rare_normal",     name:"Rare (Normal)",     points:0, group:"0 Pkt" },

  { id:"rare_foil",        name:"Rare (Foil)",        points:1, group:"Rare" },
  { id:"super_rare_normal",name:"Super Rare (Normal)",points:2, group:"Rare" },
  { id:"super_rare_foil",  name:"Super Rare (Foil)",  points:3, group:"Rare" },

  { id:"legendary_normal", name:"Legendary (Normal)", points:4, group:"High" },
  { id:"epic",             name:"Epic",               points:5, group:"High" },
  { id:"legendary_foil",   name:"Legendary (Foil)",   points:8, group:"High" },
  { id:"enchanted",        name:"Enchanted",          points:12,group:"High" },
  { id:"iconic",           name:"Iconic",             points:25,group:"High" }
];

const byId = Object.fromEntries(rarities.map(r => [r.id, r]));

const state = {
  1: Object.fromEntries(rarities.map(r => [r.id, 0])),
  2: Object.fromEntries(rarities.map(r => [r.id, 0]))
};

function addTap(el, fn){
  el.addEventListener("click", fn);
  el.addEventListener("touchend", (e) => { e.preventDefault(); fn(); }, { passive:false });
}

function buildRows(player){
  const wrap = document.getElementById("rows"+player);
  wrap.innerHTML = "";

  sections.forEach(sec => {
    const s = document.createElement("div");
    s.className = "section";
    s.textContent = sec.title;
    wrap.appendChild(s);

    sec.ids.forEach(id => {
      const r = byId[id];
      const row = document.createElement("div");
      row.className = "row";
      row.setAttribute("data-id", r.id);

      const tagText = r.points === 1 ? "1 Punkt" : (r.points + " Punkte");

      row.innerHTML = `
        <div class="left">
          <div class="rTitle">${r.name}</div>
          <div class="meta">
            <span class="tag">${tagText}</span>
            <span>${r.group}</span>
          </div>
        </div>
        <div class="controls">
          <button class="btn minus" type="button" aria-label="minus">−</button>
          <div class="count">0</div>
          <button class="btn plus" type="button" aria-label="plus">+</button>
        </div>
      `;
      wrap.appendChild(row);

      const countEl = row.querySelector(".count");
      const plus = row.querySelector(".plus");
      const minus = row.querySelector(".minus");

      addTap(plus, () => {
        state[player][r.id] += 1;
        countEl.textContent = String(state[player][r.id]);
        render();
      });

      addTap(minus, () => {
        state[player][r.id] = Math.max(0, state[player][r.id] - 1);
        countEl.textContent = String(state[player][r.id]);
        render();
      });
    });
  });
}

function scoreOf(player){
  let s = 0;
  rarities.forEach(r => { s += state[player][r.id] * r.points; });
  return s;
}

function setLeads(s1, s2){
  const b1 = document.getElementById("lead1");
  const b2 = document.getElementById("lead2");
  const leadText = document.getElementById("leadText");

  if (s1 === 0 && s2 === 0){
    b1.textContent = "–";
    b2.textContent = "–";
    leadText.textContent = "–";
    return;
  }
  if (s1 > s2){
    b1.textContent = "führt";
    b2.textContent = "hinten";
    leadText.textContent = "Spieler 1 führt";
  } else if (s2 > s1){
    b2.textContent = "führt";
    b1.textContent = "hinten";
    leadText.textContent = "Spieler 2 führt";
  } else {
    b1.textContent = "gleich";
    b2.textContent = "gleich";
    leadText.textContent = "Gleichstand";
  }
}

function render(){
  const s1 = scoreOf(1);
  const s2 = scoreOf(2);

  document.getElementById("score1").textContent = String(s1);
  document.getElementById("score2").textContent = String(s2);
  document.getElementById("chip1").textContent = String(s1);
  document.getElementById("chip2").textContent = String(s2);

  setLeads(s1, s2);
}

function resetAll(){
  [1,2].forEach(p => {
    rarities.forEach(r => { state[p][r.id] = 0; });

    const rows = document.getElementById("rows"+p).querySelectorAll(".row");
    rows.forEach(row => row.querySelector(".count").textContent = "0");
  });
  render();
}

function showPlayer(p){
  const c1 = document.getElementById("card1");
  const c2 = document.getElementById("card2");
  const t1 = document.getElementById("tab1");
  const t2 = document.getElementById("tab2");

  if (p === 1){
    c1.classList.remove("hidden");
    c2.classList.add("hidden");
    t1.classList.add("active");
    t2.classList.remove("active");
  } else {
    c2.classList.remove("hidden");
    c1.classList.add("hidden");
    t2.classList.add("active");
    t1.classList.remove("active");
  }
}

buildRows(1);
buildRows(2);
render();
showPlayer(1);

addTap(document.getElementById("resetBtn"), resetAll);
addTap(document.getElementById("tab1"), () => showPlayer(1));
addTap(document.getElementById("tab2"), () => showPlayer(2));
document.getElementById("statusText").textContent = "JavaScript aktiv";
</script>

</body>
</html>
