<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Booster Battle</title>

<style>
:root{
  --text:#f6fbff;
  --muted:rgba(246,251,255,.65);
  --gold:#f7d37a;
  --green:#2fd37a;
}

*{box-sizing:border-box}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  color:var(--text);
  background:#06111d;
  padding:16px;
}

/* ===== Header ===== */

.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:18px;
}

.formatSwitch{
  display:flex;
  gap:6px;
  background:rgba(255,255,255,.08);
  padding:4px;
  border-radius:999px;
}

.formatBtn{
  border:0;
  background:transparent;
  padding:6px 14px;
  border-radius:999px;
  color:var(--muted);
  font-weight:900;
  cursor:pointer;
}

.formatBtn.active{
  background:linear-gradient(180deg, rgba(255,213,122,.35), rgba(255,255,255,.05));
  color:white;
}

/* ===== Panels ===== */

.panel{
  border-radius:18px;
  padding:18px;
  margin-bottom:16px;
  background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.12);
  transition:.25s ease;
}

.panel.winner{
  border-color:rgba(255,213,122,.6);
  box-shadow:0 0 30px rgba(255,213,122,.35);
  transform:scale(1.02);
}

.panelHeader{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:12px;
}

.score{
  font-size:34px;
  font-weight:900;
  transition:.2s;
}

.panel.winner .score{
  font-size:42px;
  color:var(--gold);
}

.badge{
  font-size:12px;
  font-weight:900;
  padding:4px 10px;
  border-radius:999px;
  background:rgba(255,255,255,.1);
}

.panel.winner .badge{
  background:var(--gold);
  color:#08101b;
}

/* ===== Pack Info ===== */

.packInfo{
  font-size:13px;
  margin-bottom:16px;
  color:var(--muted);
}

.track{
  margin-top:8px;
  display:flex;
  gap:5px;
}

.dot{
  width:16px;
  height:8px;
  border-radius:6px;
  background:rgba(255,255,255,.12);
}

.dot.active{
  background:var(--gold);
}

/* ===== Buttons ===== */

.choice{
  margin:6px 0;
  padding:8px 12px;
  border-radius:12px;
  background:rgba(255,255,255,.08);
  cursor:pointer;
  display:flex;
  justify-content:space-between;
  font-weight:800;
}

.choice:hover{
  background:rgba(255,255,255,.15);
}

.reset{
  width:100%;
  padding:12px;
  font-weight:900;
  border-radius:14px;
  border:0;
  background:linear-gradient(180deg, rgba(255,213,122,.4), rgba(255,255,255,.1));
  cursor:pointer;
}
</style>
</head>
<body>

<div class="header">
  <h2>Booster Battle</h2>
  <div class="formatSwitch">
    <button class="formatBtn active" id="btnINT">INT</button>
    <button class="formatBtn" id="btnJP">JP</button>
  </div>
</div>

<div class="panel" id="panel1">
  <div class="panelHeader">
    <div>
      <strong>Player 1</strong>
      <span class="badge" id="badge1">–</span>
    </div>
    <div class="score" id="score1">0</div>
  </div>

  <div class="packInfo" id="packInfo1"></div>
  <div id="slots1"></div>
</div>

<div class="panel" id="panel2">
  <div class="panelHeader">
    <div>
      <strong>Player 2</strong>
      <span class="badge" id="badge2">–</span>
    </div>
    <div class="score" id="score2">0</div>
  </div>

  <div class="packInfo" id="packInfo2"></div>
  <div id="slots2"></div>
</div>

<button class="reset" id="reset">Reset</button>

<script>
let format = "INT"

const intlSlots = [
  {label:"Rarity Slot 1", options:[
    {name:"Rare", pts:0},
    {name:"Super Rare", pts:2},
    {name:"Legendary", pts:4}
  ]},
  {label:"Rarity Slot 2", options:[
    {name:"Rare", pts:0},
    {name:"Super Rare", pts:2},
    {name:"Legendary", pts:4}
  ]},
  {label:"Foil Slot", options:[
    {name:"Rare (Foil)", pts:1},
    {name:"Super Rare (Foil)", pts:3},
    {name:"Legendary (Foil)", pts:8},
    {name:"Epic", pts:5},
    {name:"Enchanted", pts:12},
    {name:"Iconic", pts:25}
  ]}
]

const jpSlots = [
  {label:"Rare or Above", options:[
    {name:"Rare", pts:0},
    {name:"Super Rare", pts:2},
    {name:"Legendary", pts:4}
  ]},
  {label:"Foil Slot", options:[
    {name:"Rare (Foil)", pts:1},
    {name:"Super Rare (Foil)", pts:3},
    {name:"Legendary (Foil)", pts:8},
    {name:"Epic", pts:5},
    {name:"Enchanted", pts:12},
    {name:"Iconic", pts:25}
  ]}
]

let state = {
  1: [],
  2: []
}

function build(){
  const slots = format==="INT" ? intlSlots : jpSlots
  state={1:new Array(slots.length).fill(null),2:new Array(slots.length).fill(null)}
  buildPlayer(1,slots)
  buildPlayer(2,slots)
  updateScores()
}

function buildPlayer(player,slots){
  const slotWrap = document.getElementById("slots"+player)
  const info = document.getElementById("packInfo"+player)
  slotWrap.innerHTML=""

  if(format==="INT"){
    info.innerHTML="12 cards • Track last 3 slots only"
  }else{
    info.innerHTML="6 cards • Track Rare+ and Foil only"
  }

  slots.forEach((slot,index)=>{
    const title=document.createElement("div")
    title.innerHTML="<strong>"+slot.label+"</strong>"
    slotWrap.appendChild(title)

    slot.options.forEach(opt=>{
      const el=document.createElement("div")
      el.className="choice"
      el.innerHTML=`${opt.name}<span>${opt.pts} pts</span>`
      el.onclick=()=>{
        state[player][index]=opt.pts
        updateScores()
      }
      slotWrap.appendChild(el)
    })
  })
}

function updateScores(){
  const s1=state[1].reduce((a,b)=>a+(b||0),0)
  const s2=state[2].reduce((a,b)=>a+(b||0),0)

  document.getElementById("score1").textContent=s1
  document.getElementById("score2").textContent=s2

  const p1=document.getElementById("panel1")
  const p2=document.getElementById("panel2")

  p1.classList.remove("winner")
  p2.classList.remove("winner")

  if(s1>0||s2>0){
    if(s1>s2){
      p1.classList.add("winner")
      badge1.textContent="WINNER"
      badge2.textContent=""
    }else if(s2>s1){
      p2.classList.add("winner")
      badge2.textContent="WINNER"
      badge1.textContent=""
    }else{
      badge1.textContent="TIE"
      badge2.textContent="TIE"
    }
  }else{
    badge1.textContent="–"
    badge2.textContent="–"
  }
}

document.getElementById("btnINT").onclick=()=>{
  format="INT"
  btnINT.classList.add("active")
  btnJP.classList.remove("active")
  build()
}

document.getElementById("btnJP").onclick=()=>{
  format="JP"
  btnJP.classList.add("active")
  btnINT.classList.remove("active")
  build()
}

document.getElementById("reset").onclick=build

build()
</script>
</body>
</html>
