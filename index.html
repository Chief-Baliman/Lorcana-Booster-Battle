<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Booster Battle">
<meta name="format-detection" content="telephone=no">
<title>Booster Battle</title>

<style>
:root{
  --bg:#06111d;
  --text:#f6fbff;
  --muted:rgba(246,251,255,.72);

  --stroke:rgba(255,255,255,.14);
  --stroke2:rgba(255,255,255,.10);

  --shadow:0 18px 48px rgba(0,0,0,.42);

  --radius:20px;
  --radius2:16px;

  --green:#2fd37a;
  --red:#ff4d6d;

  --gold:#f7d37a;
  --gold2:#e7b84f;
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  color:var(--text);
  background-color:var(--bg);
  background-image:
    radial-gradient(900px 700px at 15% -10%, rgba(140,214,255,.55), transparent 55%),
    radial-gradient(900px 700px at 95% 10%, rgba(255,213,122,.28), transparent 55%),
    radial-gradient(900px 700px at 30% 110%, rgba(255,120,180,.18), transparent 60%),
    radial-gradient(700px 500px at 85% 95%, rgba(130,255,210,.12), transparent 60%);
  background-repeat:no-repeat;
  background-attachment:fixed;
  padding:0 14px 14px 14px;
}

/* Sparkles */
body::before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:0;
  background-image:
    radial-gradient(2px 2px at 12% 18%, rgba(255,255,255,.35), transparent 60%),
    radial-gradient(2px 2px at 28% 42%, rgba(255,255,255,.22), transparent 60%),
    radial-gradient(2px 2px at 43% 14%, rgba(255,213,122,.26), transparent 60%),
    radial-gradient(2px 2px at 62% 32%, rgba(140,214,255,.22), transparent 60%),
    radial-gradient(2px 2px at 78% 18%, rgba(255,255,255,.20), transparent 60%),
    radial-gradient(2px 2px at 86% 52%, rgba(255,213,122,.18), transparent 60%),
    radial-gradient(2px 2px at 18% 76%, rgba(255,255,255,.16), transparent 60%),
    radial-gradient(2px 2px at 55% 84%, rgba(140,214,255,.16), transparent 60%),
    radial-gradient(2px 2px at 90% 86%, rgba(255,255,255,.14), transparent 60%);
  opacity:.55;
  animation:sparkleFloat 10s ease-in-out infinite;
  transform: translate3d(0,0,0);
}
@keyframes sparkleFloat{
  0%   { transform: translate3d(0,0,0); opacity:.45; }
  50%  { transform: translate3d(0,-10px,0); opacity:.65; }
  100% { transform: translate3d(0,0,0); opacity:.45; }
}

.safeTop{height: env(safe-area-inset-top);}

.header, .page{ position:relative; z-index:1; }

.header{
  position:sticky;
  top:0;
  z-index:50;
  padding:12px 0 10px 0;
  background:
    linear-gradient(180deg, rgba(7,10,18,.98), rgba(7,10,18,.78) 55%, rgba(7,10,18,0));
  backdrop-filter: blur(14px);
}

.headerInner{
  border:1px solid rgba(255,255,255,.08);
  background:rgba(12,18,40,.60);
  border-radius:20px;
  padding:12px 12px;
  box-shadow:0 14px 34px rgba(0,0,0,.40);
}

.topRow{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
}

.brand{
  display:flex;
  align-items:center;
  gap:12px;
  min-width: 220px;
}

.logo{
  width:38px;
  height:38px;
  object-fit:contain;
  border-radius:12px;
  display:block;
  border:1px solid rgba(255,255,255,.14);
  background:rgba(255,255,255,.06);
}

.brandText .title{
  font-size:16px;
  font-weight:980;
  letter-spacing:.2px;
  line-height:1.05;
}

.subline{
  display:flex;
  align-items:center;
  gap:8px;
  font-size:11px;
  color:var(--muted);
  white-space:nowrap;
}

.dot{
  width:7px;height:7px;border-radius:999px;background:var(--green);
  box-shadow:0 0 0 4px rgba(54,210,123,.12);
}

.byline{
  margin-top:4px;
  font-size:11px;
  color:rgba(246,251,255,.62);
}
.handle{
  color:var(--gold);
  text-decoration:none;
  font-weight:950;
}

.rightTop{
  display:flex;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
  justify-content:flex-end;
}

.scoreChips{
  display:flex;
  gap:8px;
  align-items:center;
}

.chip{
  background:rgba(255,255,255,.10);
  border:1px solid rgba(255,255,255,.14);
  border-radius:999px;
  padding:8px 10px;
  font-size:12px;
  color:rgba(246,251,255,.78);
  display:flex;
  align-items:center;
  gap:8px;
}

.chip b{
  color:rgba(246,251,255,.92);
  font-weight:980;
  min-width: 18px;
  text-align:right;
}

.chip.win{
  border-color: rgba(255,213,122,.45);
  background: rgba(255,213,122,.12);
}
.chip.win b{ color: var(--gold); }

.pillSwitch{
  display:flex;
  background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.08);
  border-radius:999px;
  padding:4px;
  gap:4px;
}

.pill{
  border:0;
  padding:7px 10px;
  border-radius:999px;
  background:transparent;
  color:rgba(234,240,255,.75);
  font-weight:950;
  font-size:12px;
  cursor:pointer;
  -webkit-tap-highlight-color: transparent;
}
.pill.active{
  background:linear-gradient(180deg, rgba(255,213,122,.28), rgba(255,255,255,.06));
  border:1px solid rgba(255,213,122,.25);
  color:var(--text);
}

.social{
  display:flex;
  gap:8px;
  align-items:center;
}

.socialBtn{
  width:36px;
  height:36px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:12px;
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.12);
  color:rgba(246,251,255,.92);
  text-decoration:none;
  box-shadow: 0 10px 22px rgba(0,0,0,.28);
  transition: transform .08s ease;
}
.socialBtn:active{ transform: translateY(1px) scale(.99); }
.socialBtn svg{ width:18px; height:18px; opacity:.92; }

.midRow{
  margin-top:10px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.playerTabs{
  display:flex;
  background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.08);
  border-radius:999px;
  padding:4px;
  gap:4px;
  flex:1;
  max-width: 320px;
}

.tab{
  flex:1;
  border:0;
  padding:9px 10px;
  border-radius:999px;
  background:transparent;
  color:rgba(234,240,255,.75);
  font-weight:950;
  font-size:12px;
  cursor:pointer;
  -webkit-tap-highlight-color: transparent;
}
.tab.active{
  background:linear-gradient(180deg, rgba(255,213,122,.28), rgba(255,255,255,.06));
  border:1px solid rgba(255,213,122,.25);
  color:var(--text);
}

.leadText{
  font-size:12px;
  color:rgba(246,251,255,.78);
  white-space:nowrap;
}

.page{
  padding:10px 0 calc(22px + env(safe-area-inset-bottom)) 0;
}

.card{
  background:
    radial-gradient(900px 220px at 20% 0%, rgba(255,213,122,.10), transparent 60%),
    linear-gradient(180deg, rgba(255,255,255,.10), rgba(255,255,255,.05));
  border:1px solid rgba(255,255,255,.14);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  overflow:hidden;
}

.cardHeader{
  padding:14px 14px 12px 14px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  border-bottom:1px solid rgba(255,255,255,.06);
  background:linear-gradient(180deg, rgba(255,255,255,.04), transparent);
}

.playerName{
  font-size:14px;
  font-weight:950;
  display:flex;
  align-items:center;
  gap:10px;
}

.badge{
  font-size:11px;
  padding:6px 8px;
  border-radius:999px;
  background:rgba(108,168,255,.14);
  border:1px solid rgba(108,168,255,.22);
  color:rgba(234,240,255,.88);
}

.score{
  font-size:34px;
  font-weight:980;
  transition: transform .12s ease, color .12s ease;
}

.card.winner{
  border-color: rgba(255,213,122,.35);
  box-shadow: 0 20px 60px rgba(0,0,0,.45), 0 0 36px rgba(255,213,122,.18);
}
.card.winner .score{
  color: var(--gold);
  transform: scale(1.12);
}
.badge.win{
  background: rgba(255,213,122,.18);
  border-color: rgba(255,213,122,.38);
  color: var(--gold);
}

.rows{
  padding:12px;
  display:flex;
  flex-direction:column;
  gap:12px;
}

.packBar{
  border:1px solid rgba(255,255,255,.10);
  background: rgba(255,255,255,.06);
  border-radius: 16px;
  padding:12px;
}

.packTitle{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  font-weight:950;
  font-size:13px;
}
.packMeta{
  margin-top:8px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  color: var(--muted);
  font-size:12px;
}
.progress{
  margin-top:10px;
  display:flex;
  gap:6px;
  align-items:center;
  flex-wrap:wrap;
}
.pdot{
  width:18px;
  height:8px;
  border-radius: 999px;
  background: rgba(255,255,255,.10);
  border: 1px solid rgba(255,255,255,.10);
}
.pdot.on{
  background: rgba(255,213,122,.22);
  border-color: rgba(255,213,122,.28);
}

.slot{
  border:1px solid rgba(255,255,255,.10);
  background:
    radial-gradient(700px 140px at 20% 0%, rgba(255,213,122,.08), transparent 60%),
    linear-gradient(180deg, rgba(255,255,255,.08), rgba(255,255,255,.03));
  border-radius:18px;
  padding:12px;
}

.slotHead{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:10px;
}

.slotTitle{
  font-weight:980;
  font-size:13px;
}
.slotHint{
  font-size:12px;
  color:var(--muted);
  margin-top:2px;
}

.clearBtn{
  border:1px solid rgba(255,255,255,.14);
  background: rgba(255,255,255,.06);
  color: rgba(246,251,255,.86);
  border-radius: 999px;
  padding:8px 12px;
  font-weight:950;
  font-size:12px;
  cursor:pointer;
  -webkit-tap-highlight-color: transparent;
}
.clearBtn:active{ transform: translateY(1px); }

.optGrid{
  display:grid;
  grid-template-columns: 1fr;
  gap:10px;
}

@media(min-width: 900px){
  .optGrid{ grid-template-columns: 1fr 1fr 1fr; }
}

.opt{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  padding:12px 12px;
  border-radius:16px;
  border:1px solid rgba(255,255,255,.10);
  background: rgba(255,255,255,.06);
  cursor:pointer;
  -webkit-tap-highlight-color: transparent;
  transition: transform .08s ease, border-color .12s ease, background .12s ease;
}
.opt:active{ transform: translateY(1px) scale(.995); }

.optLeft{
  display:flex;
  align-items:center;
  gap:10px;
  min-width: 0;
}

.ico{
  width:28px;
  height:28px;
  border-radius:10px;
  border:1px solid rgba(255,255,255,.12);
  background: rgba(255,255,255,.08);
  display:flex;
  align-items:center;
  justify-content:center;
  flex:0 0 auto;
}
.ico svg{ width:16px; height:16px; opacity:.95; }

.optName{
  font-weight:980;
  font-size:13px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.optPts{
  font-weight:980;
  font-size:12px;
  color: rgba(246,251,255,.86);
  background: rgba(255,255,255,.07);
  border: 1px solid rgba(255,255,255,.10);
  padding:6px 10px;
  border-radius:999px;
}

.opt.selected{
  border-color: rgba(255,213,122,.32);
  background: rgba(255,213,122,.10);
}
.opt.selected .optPts{
  border-color: rgba(255,213,122,.28);
  background: rgba(255,213,122,.14);
  color: var(--gold);
}

.actions{ margin-top:12px; }
.resetBtn{
  width:100%;
  padding:15px 16px;
  border-radius:20px;
  border:1px solid rgba(255,255,255,.12);
  background:
    radial-gradient(900px 140px at 20% 0%, rgba(255,213,122,.14), transparent 55%),
    linear-gradient(180deg, rgba(255,255,255,.10), rgba(255,255,255,.04));
  color:var(--text);
  font-weight:980;
  font-size:14px;
  letter-spacing:.2px;
  box-shadow:0 16px 40px rgba(0,0,0,.35);
  cursor:pointer;
}
.resetBtn:active{ transform: translateY(1px); }

.tip{
  margin:10px 2px 0 2px;
  font-size:11px;
  color:var(--muted);
  line-height:1.35;
}

.hidden{ display:none; }
</style>
</head>

<body>
<div class="safeTop"></div>

<div class="header">
  <div class="headerInner">
    <div class="topRow">
      <div class="brand">
        <img src="logo.png" alt="Chief Baliman" class="logo">
        <div class="brandText">
          <div class="title">Booster Battle</div>
          <div class="subline">
            <span class="dot"></span>
            <span id="statusText">JavaScript active</span>
          </div>
          <div class="byline">
            by <a class="handle" href="https://www.instagram.com/chief_baliman/" target="_blank" rel="noopener">chief_baliman</a>
          </div>
        </div>
      </div>

      <div class="rightTop">
        <div class="pillSwitch" aria-label="Format">
          <button class="pill active" id="fmtINT" type="button">INT</button>
          <button class="pill" id="fmtJP" type="button">JP</button>
        </div>

        <div class="scoreChips" aria-label="Scores">
          <div class="chip" id="chipP1">P1 <b id="chip1">0</b></div>
          <div class="chip" id="chipP2">P2 <b id="chip2">0</b></div>
        </div>

        <div class="social">
          <a class="socialBtn" href="https://www.instagram.com/chief_baliman/" target="_blank" rel="noopener" aria-label="Instagram">
            <svg viewBox="0 0 24 24" fill="none">
              <path d="M7 3h10a4 4 0 0 1 4 4v10a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4V7a4 4 0 0 1 4-4Z" stroke="currentColor" stroke-width="2"/>
              <path d="M12 17a5 5 0 1 0 0-10 5 5 0 0 0 0 10Z" stroke="currentColor" stroke-width="2"/>
              <path d="M17.5 6.5h.01" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
            </svg>
          </a>
          <a class="socialBtn" href="https://www.tiktok.com/@chief_baliman" target="_blank" rel="noopener" aria-label="TikTok">
            <svg viewBox="0 0 24 24" fill="none">
              <path d="M14 4v10.2a3.8 3.8 0 1 1-3-3.7" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
              <path d="M14 4c1.2 2.5 3.2 4 6 4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
          </a>
        </div>
      </div>
    </div>

    <div class="midRow">
      <div class="playerTabs" role="tablist" aria-label="Player switch">
        <button class="tab active" id="tab1" type="button">Player 1</button>
        <button class="tab" id="tab2" type="button">Player 2</button>
      </div>
      <div class="leadText" id="leadText">–</div>
    </div>
  </div>
</div>

<div class="page">
  <div class="card" id="card1">
    <div class="cardHeader">
      <div class="playerName">
        <span>Player 1</span>
        <span class="badge" id="badge1">–</span>
      </div>
      <div class="score" id="score1">0</div>
    </div>
    <div class="rows" id="rows1"></div>
  </div>

  <div class="card hidden" id="card2">
    <div class="cardHeader">
      <div class="playerName">
        <span>Player 2</span>
        <span class="badge" id="badge2">–</span>
      </div>
      <div class="score" id="score2">0</div>
    </div>
    <div class="rows" id="rows2"></div>
  </div>

  <div class="actions">
    <button class="resetBtn" id="resetBtn" type="button">Reset</button>
  </div>
  <div class="tip">Tip: Add to Home Screen to use it like an app.</div>
</div>

<script>
/*
Points (your system):
Common & Uncommon: 0
Rare (Normal): 0
Rare (Foil): 1
Super Rare (Normal): 2
Super Rare (Foil): 3
Legendary (Normal): 4
Legendary (Foil): 8
Epic: 5
Enchanted: 12
Iconic: 25

Pack structure:
INT (12 cards): track last 3 slots
  Slot A: Rare / Super Rare / Legendary
  Slot B: Rare / Super Rare / Legendary
  Foil Slot: any rarity possible (including Enchanted)

JP (6 cards): track 2 slots
  Rare+ Slot: Rare / Super Rare / Legendary
  Foil Slot: any rarity possible (including Enchanted)
*/

const formats = {
  INT: {
    key: "INT",
    packTitle: "Booster structure (12 cards)",
    packMeta: "Track only the last 3 slots",
    dots: { total: 12, highlightFrom: 10 }, // last 3
    slots: [
      {
        id: "r1",
        title: "Rarity slot 1",
        hint: "Rare / Super Rare / Legendary",
        options: [
          { id:"rare_n", name:"Rare", pts:0, icon:"rare", tint:"bronze" },
          { id:"sr_n",   name:"Super Rare", pts:2, icon:"sr", tint:"silver" },
          { id:"leg_n",  name:"Legendary", pts:4, icon:"leg", tint:"gold" }
        ]
      },
      {
        id: "r2",
        title: "Rarity slot 2",
        hint: "Rare / Super Rare / Legendary",
        options: [
          { id:"rare_n", name:"Rare", pts:0, icon:"rare", tint:"bronze" },
          { id:"sr_n",   name:"Super Rare", pts:2, icon:"sr", tint:"silver" },
          { id:"leg_n",  name:"Legendary", pts:4, icon:"leg", tint:"gold" }
        ]
      },
      {
        id: "foil",
        title: "Foil slot",
        hint: "Any rarity possible (incl. Enchanted)",
        options: [
          { id:"common", name:"Common", pts:0, icon:"common", tint:"gray" },
          { id:"uncommon", name:"Uncommon", pts:0, icon:"uncommon", tint:"gray" },
          { id:"rare_f", name:"Rare (Foil)", pts:1, icon:"rare", tint:"bronze" },
          { id:"sr_f", name:"Super Rare (Foil)", pts:3, icon:"sr", tint:"silver" },
          { id:"leg_f", name:"Legendary (Foil)", pts:8, icon:"leg", tint:"gold" },
          { id:"epic", name:"Epic", pts:5, icon:"epic", tint:"rainbow" },
          { id:"ench", name:"Enchanted", pts:12, icon:"ench", tint:"rainbow" },
          { id:"iconic", name:"Iconic", pts:25, icon:"iconic", tint:"rainbow" }
        ]
      }
    ]
  },

  JP: {
    key: "JP",
    packTitle: "Booster structure (6 cards)",
    packMeta: "Track Rare+ and Foil only",
    dots: { total: 6, highlightFrom: 5 }, // last 2
    slots: [
      {
        id: "rareplus",
        title: "Rare+ slot",
        hint: "Rare / Super Rare / Legendary",
        options: [
          { id:"rare_n", name:"Rare", pts:0, icon:"rare", tint:"bronze" },
          { id:"sr_n",   name:"Super Rare", pts:2, icon:"sr", tint:"silver" },
          { id:"leg_n",  name:"Legendary", pts:4, icon:"leg", tint:"gold" }
        ]
      },
      {
        id: "foil",
        title: "Foil slot",
        hint: "Any rarity possible (incl. Enchanted)",
        options: [
          { id:"common", name:"Common", pts:0, icon:"common", tint:"gray" },
          { id:"uncommon", name:"Uncommon", pts:0, icon:"uncommon", tint:"gray" },
          { id:"rare_f", name:"Rare (Foil)", pts:1, icon:"rare", tint:"bronze" },
          { id:"sr_f", name:"Super Rare (Foil)", pts:3, icon:"sr", tint:"silver" },
          { id:"leg_f", name:"Legendary (Foil)", pts:8, icon:"leg", tint:"gold" },
          { id:"epic", name:"Epic", pts:5, icon:"epic", tint:"rainbow" },
          { id:"ench", name:"Enchanted", pts:12, icon:"ench", tint:"rainbow" },
          { id:"iconic", name:"Iconic", pts:25, icon:"iconic", tint:"rainbow" }
        ]
      }
    ]
  }
};

let currentFormat = "INT";

const state = {
  INT: { 1:{}, 2:{} },
  JP:  { 1:{}, 2:{} }
};

function iconSVG(kind, tint){
  const c = {
    gray:   "rgba(246,251,255,.75)",
    bronze: "#c98b5a",
    silver: "#cfd6de",
    gold:   "#f7d37a",
    rainbow: "url(#rg)"
  };

  const base = (fill) => `
    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <defs>
        <linearGradient id="rg" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#8cd6ff"/>
          <stop offset=".35" stop-color="#ffd57a"/>
          <stop offset=".7" stop-color="#ff78b4"/>
          <stop offset="1" stop-color="#82ffd2"/>
        </linearGradient>
      </defs>
      ${fill}
    </svg>
  `;

  const stroke = (color) => `stroke="${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"`;
  const col = (tint === "rainbow") ? c.rainbow : c[tint];

  if(kind === "common"){
    return base(`<circle cx="12" cy="12" r="6" ${stroke(col)} />`);
  }
  if(kind === "uncommon"){
    return base(`<path d="M6 7h12v10H6z" ${stroke(col)} />`);
  }
  if(kind === "rare"){
    return base(`<path d="M12 5l7 14H5l7-14Z" ${stroke(col)} />`);
  }
  if(kind === "sr"){
    return base(`<path d="M12 4l6 6-6 10-6-10 6-6Z" ${stroke(col)} />`);
  }
  if(kind === "leg"){
    return base(`<path d="M12 4l7 5-3 11H8L5 9l7-5Z" ${stroke(col)} />`);
  }
  if(kind === "epic"){
    return base(`<path d="M12 4l5 7-5 9-5-9 5-7Z" ${stroke(col)} /><path d="M9 11h6" ${stroke(col)} />`);
  }
  if(kind === "ench"){
    return base(`<path d="M12 4l8 8-8 8-8-8 8-8Z" ${stroke(col)} /><path d="M12 8v8" ${stroke(col)} />`);
  }
  if(kind === "iconic"){
    return base(`<path d="M12 4l8 6-8 10-8-10 8-6Z" ${stroke(col)} /><circle cx="12" cy="12" r="2" ${stroke(col)} />`);
  }
  return base(`<circle cx="12" cy="12" r="7" ${stroke(col)} />`);
}

function initFormatState(fmt){
  const f = formats[fmt];
  [1,2].forEach(p=>{
    f.slots.forEach(s=>{
      if(state[fmt][p][s.id] === undefined) state[fmt][p][s.id] = null;
    });
  });
}

function buildPackBar(f){
  const dots = [];
  for(let i=1;i<=f.dots.total;i++){
    const on = i >= f.dots.highlightFrom;
    dots.push(`<span class="pdot ${on ? "on":""}"></span>`);
  }
  return `
    <div class="packBar">
      <div class="packTitle">
        <span>${f.packTitle}</span>
        <span style="color:rgba(246,251,255,.72);font-weight:900;">${f.key}</span>
      </div>
      <div class="packMeta">
        <span>${f.packMeta}</span>
        <span style="opacity:.85;">${f.dots.total} cards</span>
      </div>
      <div class="progress" aria-hidden="true">${dots.join("")}</div>
    </div>
  `;
}

function buildSlots(player){
  const f = formats[currentFormat];
  const wrap = document.getElementById("rows"+player);
  wrap.innerHTML = "";

  wrap.insertAdjacentHTML("beforeend", buildPackBar(f));

  f.slots.forEach(slot=>{
    const selected = state[currentFormat][player][slot.id];

    const opts = slot.options.map(opt=>{
      const isSel = selected && selected.optId === opt.id;
      return `
        <div class="opt ${isSel ? "selected":""}" data-slot="${slot.id}" data-opt="${opt.id}">
          <div class="optLeft">
            <span class="ico">${iconSVG(opt.icon, opt.tint)}</span>
            <span class="optName">${opt.name}</span>
          </div>
          <span class="optPts">${opt.pts} pts</span>
        </div>
      `;
    }).join("");

    wrap.insertAdjacentHTML("beforeend", `
      <div class="slot" data-slotwrap="${slot.id}">
        <div class="slotHead">
          <div>
            <div class="slotTitle">${slot.title}</div>
            <div class="slotHint">${slot.hint}</div>
          </div>
          <button class="clearBtn" type="button" data-clear="${slot.id}">Clear</button>
        </div>
        <div class="optGrid">${opts}</div>
      </div>
    `);
  });

  wrap.querySelectorAll(".opt").forEach(el=>{
    el.addEventListener("click", ()=>{
      const slotId = el.getAttribute("data-slot");
      const optId  = el.getAttribute("data-opt");
      const f2 = formats[currentFormat];
      const slot = f2.slots.find(s=>s.id===slotId);
      const opt  = slot.options.find(o=>o.id===optId);
      state[currentFormat][player][slotId] = { optId: opt.id, pts: opt.pts };
      buildSlots(player);
      render();
    });
  });

  wrap.querySelectorAll("[data-clear]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const slotId = btn.getAttribute("data-clear");
      state[currentFormat][player][slotId] = null;
      buildSlots(player);
      render();
    });
  });
}

function scoreOf(player){
  const f = formats[currentFormat];
  let s = 0;
  f.slots.forEach(slot=>{
    const v = state[currentFormat][player][slot.id];
    if(v && typeof v.pts === "number") s += v.pts;
  });
  return s;
}

function setWinnerUI(s1, s2){
  const c1 = document.getElementById("card1");
  const c2 = document.getElementById("card2");
  const b1 = document.getElementById("badge1");
  const b2 = document.getElementById("badge2");
  const leadText = document.getElementById("leadText");
  const chip1 = document.getElementById("chipP1");
  const chip2 = document.getElementById("chipP2");

  c1.classList.remove("winner");
  c2.classList.remove("winner");
  b1.classList.remove("win");
  b2.classList.remove("win");
  chip1.classList.remove("win");
  chip2.classList.remove("win");

  if(s1 === 0 && s2 === 0){
    b1.textContent = "–";
    b2.textContent = "–";
    leadText.textContent = "–";
    return;
  }

  if(s1 > s2){
    c1.classList.add("winner");
    b1.classList.add("win");
    chip1.classList.add("win");
    b1.textContent = "WINNER";
    b2.textContent = "–";
    leadText.textContent = "Player 1 leads";
  } else if(s2 > s1){
    c2.classList.add("winner");
    b2.classList.add("win");
    chip2.classList.add("win");
    b2.textContent = "WINNER";
    b1.textContent = "–";
    leadText.textContent = "Player 2 leads";
  } else {
    b1.textContent = "TIE";
    b2.textContent = "TIE";
    leadText.textContent = "Tie";
  }
}

function render(){
  const s1 = scoreOf(1);
  const s2 = scoreOf(2);

  document.getElementById("score1").textContent = String(s1);
  document.getElementById("score2").textContent = String(s2);
  document.getElementById("chip1").textContent = String(s1);
  document.getElementById("chip2").textContent = String(s2);

  setWinnerUI(s1, s2);
}

function resetAll(){
  initFormatState(currentFormat);
  const f = formats[currentFormat];
  [1,2].forEach(p=>{
    f.slots.forEach(s=> state[currentFormat][p][s.id] = null);
  });
  buildSlots(1);
  buildSlots(2);
  render();
}

function showPlayer(p){
  const card1 = document.getElementById("card1");
  const card2 = document.getElementById("card2");
  const t1 = document.getElementById("tab1");
  const t2 = document.getElementById("tab2");
  if(p===1){
    card1.classList.remove("hidden");
    card2.classList.add("hidden");
    t1.classList.add("active");
    t2.classList.remove("active");
  }else{
    card2.classList.remove("hidden");
    card1.classList.add("hidden");
    t2.classList.add("active");
    t1.classList.remove("active");
  }
}

function setFormat(fmt){
  currentFormat = fmt;
  document.getElementById("fmtINT").classList.toggle("active", fmt==="INT");
  document.getElementById("fmtJP").classList.toggle("active", fmt==="JP");
  initFormatState(fmt);
  buildSlots(1);
  buildSlots(2);
  render();
}

initFormatState("INT");
initFormatState("JP");

document.getElementById("resetBtn").addEventListener("click", resetAll);
document.getElementById("tab1").addEventListener("click", ()=>showPlayer(1));
document.getElementById("tab2").addEventListener("click", ()=>showPlayer(2));
document.getElementById("fmtINT").addEventListener("click", ()=>setFormat("INT"));
document.getElementById("fmtJP").addEventListener("click", ()=>setFormat("JP"));

document.getElementById("statusText").textContent = "JavaScript active";

setFormat("INT");
showPlayer(1);
</script>

</body>
</html>
